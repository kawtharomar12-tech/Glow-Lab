<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Glow Lab | Wishlist</title>


    <!-- Shared CSS -->
    <link
        rel="stylesheet"
        href="../shared/shared.css">


    <!-- Wishlist CSS -->
    <link
        rel="stylesheet"
        href="wishlist.css">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


    <!-- Shared Header -->

    <div id="site-header"></div>



    <main class="wishlist-page">


        <!-- PAGE TITLE -->

        <section class="wishlist-heading">

            <p>
                YOUR FAVORITES
            </p>

            <h1>
                My Wishlist ♡
            </h1>

            <span>
                Products you saved for later
            </span>

        </section>



        <!-- WISHLIST PRODUCTS -->

        <section
            class="wishlist-grid"
            id="wishlistGrid">

        </section>



        <!-- EMPTY STATE -->

        <section
            class="wishlist-empty"
            id="wishlistEmpty">

            <i class="fa-regular fa-heart"></i>

            <h2>
                Your wishlist is empty
            </h2>

            <p>
                Save products you love and
                find them here later.
            </p>


            <a
                href="../index/glow.html"
                class="shop-button">

                Continue Shopping

            </a>

        </section>


    </main>



    <!-- Shared Footer -->

    <div id="site-footer"></div>



    <!-- Shared JS -->

    <script src="../shared/shared.js"></script>


    <!-- Wishlist JS -->

    <script src="wishlist.js"></script>


</body>

</html>

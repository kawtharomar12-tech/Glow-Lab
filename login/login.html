<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Glow Lab | Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <!-- <header class="header">

        <div class="logo">
            Glow Lab
        </div>

        <nav class="nav-links">

            
            <a href="../index/glow.html">Home</a>

        </nav>

    </header> --> 


    <!-- ================= LOGIN PAGE ================= -->

    <main class="login-page">


        <!-- ================= LEFT SIDE ================= -->

        <div class="login-image">

            <div class="image-text">
                <img src="../images/GLlogo.png" alt="Glow Lab Login Image">
                <h2>Beauty Begins With You</h2>

                <p>
                    Discover your Glow.
                </p>

            </div>

        </div>



        <!-- ================= RIGHT SIDE ================= -->

        <div class="login-container">


            <div class="login-card">


                <h1>
                    Welcome Back 
                </h1>


                <p class="subtitle">
                    Log in to your Glow Lab account
                </p>



                <!-- ================= LOGIN FORM ================= -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">


                        <label for="password">
                            Password
                        </label>


                        <div class="password-box">


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required>


                            <button
                                type="button"
                                id="showPassword"
                                aria-label="Show password">

                                👁

                            </button>


                        </div>

                    </div>



                    <!-- FORGOT PASSWORD -->

                    <div class="forgot-password">

                        <a href="#">
                            Forgot your password?
                        </a>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button">

                        Log In

                    </button>


                </form>



                <!-- ================= DIVIDER ================= -->

                <div class="divider">

                    <span></span>

                    <p>
                        Don't have an account?
                    </p>

                    <span></span>

                </div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="button"
                    class="create-account" 
                    id="createAccountButton">
 

                    Create an Account

                </button>


            </div>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>

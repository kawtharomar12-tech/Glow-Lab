<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Glow Lab | Create Account</title>

    <link
        rel="stylesheet"
        href="register.css">

</head>


<body>


    <!-- ================= REGISTER PAGE ================= -->

    <main class="register-page">


        <!-- ================= LEFT SIDE ================= -->

        <div class="register-image">


            <div class="image-text">


                <img
                    src="../images/GLlogo.png"
                    alt="Glow Lab Logo">


                <h2>
                    Your Glow Starts Here
                </h2>


                <p>
                    Create your Glow Lab account.
                </p>


            </div>


        </div>



        <!-- ================= RIGHT SIDE ================= -->

        <div class="register-container">


            <div class="register-card">


                <h1>
                    Create Account ♡
                </h1>


                <p class="subtitle">
                    Join Glow Lab and discover your glow
                </p>



                <!-- ================= REGISTER FORM ================= -->

                <form id="registerForm">


                    <!-- FULL NAME -->

                  <div class="name-row">

             <div class="input-group">

                <label for="firstName">
                First Name
               </label>

             <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="First name"
              required>
 
            </div>


            <div class="input-group">

             <label for="lastName">
              Last Name
             </label>

             <input
             type="text"
             id="lastName"
             name="lastName"
             placeholder="Last name"
             required>

            </div>

            </div>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">


                        <label for="password">
                            Password
                        </label>


                        <div class="password-box">


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required>


                            <button
                                type="button"
                                class="show-password"
                                data-target="password"
                                aria-label="Show password">

                                👁

                            </button>


                        </div>


                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">


                        <label for="confirmPassword">
                            Confirm Password
                        </label>


                        <div class="password-box">


                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required>


                            <button
                                type="button"
                                class="show-password"
                                data-target="confirmPassword"
                                aria-label="Show password">

                                👁

                            </button>


                        </div>


                    </div>



                    <!-- ERROR MESSAGE -->

                    <p
                        class="error-message"
                        id="errorMessage">
                    </p>



                    <!-- CREATE ACCOUNT -->

                    <button
                        type="submit"
                        class="register-button">

                        Create Account

                    </button>


                </form>



                <!-- ================= DIVIDER ================= -->

                <div class="divider">

                    <span></span>

                    <p>
                        Already have an account?
                    </p>

                    <span></span>

                </div>



                <!-- LOGIN -->

                <a
                    href="../login/login.html"
                    class="login-button">

                    Log In

                </a>


            </div>


        </div>


    </main>


    <script src="register.js"></script>


</body>

</html>

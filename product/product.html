<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Glow Lab | Product Details</title>

    <!-- Shared CSS -->
    <link
        rel="stylesheet"
        href="../shared/shared.css">

    <!-- Product CSS -->
    <link
        rel="stylesheet"
        href="product.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>

    <!-- Shared Header -->
    <div id="site-header"></div>


    <main class="product-page">

        <a
            href="../index/glow.html"
            class="back-link">

            <i class="fa-solid fa-arrow-left"></i>

            Back to products

        </a>


        <section
            class="product-details"
            id="productDetails">


            <!-- PRODUCT IMAGE -->

            <div class="product-details-image">

                <span
                    class="details-badge"
                    id="productBadge">
                </span>

                <img
                    id="productImage"
                    src=""
                    alt="">

            </div>


            <!-- PRODUCT INFO -->

            <div class="product-details-info">


                <p
                    class="details-category"
                    id="productCategory">
                </p>


                <h1 id="productName">
                    Product Name
                </h1>


                <p
                    class="details-price"
                    id="productPrice">
                    0.00 JD
                </p>


                <div class="details-divider"></div>


                <p
                    class="details-description"
                    id="productDescription">
                </p>


                <div class="details-features">

                    <div>

                        <i class="fa-solid fa-check"></i>

                        <span>
                            Authentic beauty product
                        </span>

                    </div>


                    <div>

                        <i class="fa-solid fa-truck-fast"></i>

                        <span>
                            Fast delivery across Jordan
                        </span>

                    </div>


                    <div>

                        <i class="fa-regular fa-heart"></i>

                        <span>
                            Save your favorites anytime
                        </span>

                    </div>

                </div>


                <div class="details-actions">

                    <button
                        type="button"
                        class="details-cart-button"
                        id="addToCartButton">

                        <i class="fa-solid fa-bag-shopping"></i>

                        Add to Bag

                    </button>


                    <button
                        type="button"
                        class="details-wishlist-button"
                        id="wishlistButton"
                        aria-label="Add to wishlist">

                        <i class="fa-regular fa-heart"></i>

                    </button>

                </div>

            </div>

        </section>


        <!-- PRODUCT NOT FOUND -->

        <section
            class="product-not-found"
            id="productNotFound">

            <i class="fa-regular fa-face-frown"></i>

            <h2>
                Product not found
            </h2>

            <p>
                We could not find this product.
            </p>

            <a
                href="../index/glow.html"
                class="return-button">

                Return to Home

            </a>

        </section>

    </main>


    <!-- Shared Footer -->
    <div id="site-footer"></div>


    <!-- Shared JavaScript -->
    <script src="../shared/shared.js"></script>

    <!-- Product JavaScript -->
    <script src="product.js"></script>

</body>

</html>
